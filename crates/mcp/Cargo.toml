[package]
name = "galroon-mcp"
version = "0.0.2"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
galroon-core = { path = "../core" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
