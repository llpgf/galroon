name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (defaults to v<package.json version>)'
        required: false
      publish:
        description: 'Upload signed artifacts to GitHub Release'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: npm ci
      - name: Fetch Rust dependencies
        run: cargo fetch --locked --target x86_64-pc-windows-msvc
      - name: Build signed Windows desktop installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw 'TAURI_SIGNING_PRIVATE_KEY secret is not configured.'
          }
          npm run desktop:build
      - name: Generate Tauri updater manifest and checksums
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Get-Content -Raw 'package.json' | ConvertFrom-Json
          $version = $pkg.version
          $tag = if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME) { $env:REF_NAME } elseif ($env:INPUT_TAG) { $env:INPUT_TAG } else { "v$version" }
          $nsisDir = Resolve-Path 'target/release/bundle/nsis'
          $installer = Get-ChildItem -Path $nsisDir -Filter '*-setup.exe' -File | Sort-Object Name | Select-Object -First 1
          if (-not $installer) { throw 'No NSIS installer found in target/release/bundle/nsis/*-setup.exe' }
          $sigFile = Get-Item "$($installer.FullName).sig" -ErrorAction Stop
          $signature = (Get-Content -Raw $sigFile.FullName).Trim()
          $manifest = [ordered]@{
            version = $version
            notes = "See https://github.com/llpgf/galroon/releases/tag/$tag"
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = $signature
                url = "https://github.com/llpgf/galroon/releases/download/$tag/$($installer.Name)"
              }
            }
          }
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          $outDir = Join-Path (Resolve-Path 'target').Path 'release-windows'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          Copy-Item $installer.FullName $outDir
          Copy-Item $sigFile.FullName $outDir
          [System.IO.File]::WriteAllText((Join-Path $outDir 'latest.json'), ($manifest | ConvertTo-Json -Depth 5), $utf8NoBom)
          $hash = (Get-FileHash -Algorithm SHA256 -Path $installer.FullName).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllLines((Join-Path $outDir 'SHA256SUMS-windows.txt'), @("$hash  $($installer.Name)"), $utf8NoBom)
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: target/release-windows/
          if-no-files-found: error
          retention-days: 30

  nas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build Linux x86_64 Core
        run: cargo build --release -p galroon-core --bin galroon-core
      - name: Build Web UI
        run: npm ci && npm run build
      - name: Assemble, sign and verify NAS update bundle
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}" || { echo 'TAURI_SIGNING_PRIVATE_KEY secret is not configured.' >&2; exit 1; }
          mkdir -p target/nas/web target/release-nas
          cp target/release/galroon-core target/nas/galroon-core
          chmod 0755 target/nas/galroon-core
          cp -a dist/. target/nas/web/
          git rev-parse HEAD > target/nas/BUILD_SHA
          (cd target/nas && find galroon-core web BUILD_SHA -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

          tar -C target/nas -czf target/release-nas/galroon-nas-x86_64.tar.gz galroon-core web BUILD_SHA SHA256SUMS
          npx tauri signer sign target/release-nas/galroon-nas-x86_64.tar.gz

          # Verify keypair consistency between GitHub Secret, tauri.conf.json, and updates.rs
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          python3 - <<'PY'
          import base64, json, re, subprocess, tempfile
          from pathlib import Path
          tauri_cfg = json.loads(Path('apps/desktop/src-tauri/tauri.conf.json').read_text(encoding='utf-8'))
          tauri_pub_box = base64.b64decode(tauri_cfg['plugins']['updater']['pubkey']).decode('utf-8')
          tauri_pub_line = [l.strip() for l in tauri_pub_box.splitlines() if l.strip() and not l.startswith('untrusted comment:')][0]
          updates_rs = Path('crates/core/src/updates.rs').read_text(encoding='utf-8')
          m = re.search(r'UPDATE_PUBKEY:&str="([^"]+)"', updates_rs)
          assert m, 'UPDATE_PUBKEY not found in crates/core/src/updates.rs'
          core_pub_line = m.group(1)
          assert tauri_pub_line == core_pub_line, f'Pubkey mismatch: tauri.conf.json ({tauri_pub_line}) != updates.rs ({core_pub_line})'
          raw_sig = base64.b64decode(Path('target/release-nas/galroon-nas-x86_64.tar.gz.sig').read_text(encoding='utf-8').strip())
          with tempfile.NamedTemporaryFile(suffix='.minisig', delete=False) as tf:
              tf.write(raw_sig)
              sig_path = tf.name
          subprocess.check_call(['minisign', '-Vm', 'target/release-nas/galroon-nas-x86_64.tar.gz', '-x', sig_path, '-P', core_pub_line])
          print('Verified NAS bundle signature against embedded public key:', core_pub_line)
          PY

          VERSION=$(node -p "require('./package.json').version")
          if [ "${REF_TYPE:-}" = "tag" ] && [ -n "${REF_NAME:-}" ]; then
            TAG="$REF_NAME"
          elif [ -n "${INPUT_TAG:-}" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v$VERSION"
          fi
          SHA=$(sha256sum target/release-nas/galroon-nas-x86_64.tar.gz | awk '{print $1}')
          SIZE=$(stat -c %s target/release-nas/galroon-nas-x86_64.tar.gz)
          printf '%s  galroon-nas-x86_64.tar.gz\n' "$SHA" > target/release-nas/SHA256SUMS-nas.txt
          cat > target/release-nas/nas-latest.json <<JSON
          {
            "version": "$VERSION",
            "url": "https://github.com/llpgf/galroon/releases/download/$TAG/galroon-nas-x86_64.tar.gz",
            "sig_url": "https://github.com/llpgf/galroon/releases/download/$TAG/galroon-nas-x86_64.tar.gz.sig",
            "sha256": "$SHA",
            "size": $SIZE
          }
          JSON
      - uses: actions/upload-artifact@v4
        with:
          name: release-nas
          path: target/release-nas/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: galroon-nas-x86_64
          path: target/nas/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [windows, nas]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: release-nas
          path: release-assets
      - name: Upload signed assets to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [ "${REF_TYPE:-}" = "tag" ] && [ -n "${REF_NAME:-}" ]; then
            TAG="$REF_NAME"
          elif [ -n "${INPUT_TAG:-}" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v$VERSION"
          fi
          cat release-assets/SHA256SUMS-windows.txt release-assets/SHA256SUMS-nas.txt > release-assets/SHA256SUMS.txt
          rm -f release-assets/SHA256SUMS-windows.txt release-assets/SHA256SUMS-nas.txt
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ -f "docs/releases/${TAG}.md" ]; then
              gh release create "$TAG" --title "Galroon $TAG" --notes-file "docs/releases/${TAG}.md"
            else
              gh release create "$TAG" --title "Galroon $TAG" --generate-notes
            fi
          fi
          gh release upload "$TAG" release-assets/* --clobber
